<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8"><title>Oasis Admin</title>
    <link href="https://fonts.googleapis.com/css2?family=Cairo&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Cairo'; background: #020617; color: white; padding: 20px; }
        .card { background: #1e293b; padding: 20px; border-radius: 15px; margin-bottom: 20px; }
        table { width: 100%; border-collapse: collapse; }
        th, td { padding: 12px; border-bottom: 1px solid #334155; text-align: right; }
        .btn { background: #22c55e; color: white; border: none; padding: 8px 15px; border-radius: 5px; cursor: pointer; }
    </style>
</head>
<body>
    <h1>لوحة تحكم الأدمن @suui_7</h1>
    <div class="card">
        <h3>إيداعات بانتظار التأكيد</h3>
        <table>
            <thead><tr><th>المستخدم</th><th>TXID</th><th>المبلغ لإضافته</th><th>إجراء</th></tr></thead>
            <tbody id="dep-list"></tbody>
        </table>
    </div>

    <script>
        async function load() {
            const res = await fetch('/api/admin/pending');
            const data = await res.json();
            const list = document.getElementById('dep-list');
            list.innerHTML = '';
            data.pending.forEach(d => {
                list.innerHTML += `<tr><td>${d.email}</td><td>${d.txid}</td>
                <td><input type="number" id="amt-${d.id}" style="width:60px"></td>
                <td><button class="btn" onclick="confirmD(${d.id})">تأكيد</button></td></tr>`;
            });
        }
        async function confirmD(id) {
            const amount = document.getElementById('amt-'+id).value;
            await fetch('/api/admin/confirm', { method: 'POST', headers: {'Content-Type': 'application/json'}, body: JSON.stringify({id, amount}) });
            alert('تم التأكيد'); load();
        }
        load();
    </script>
</body>
</html>
